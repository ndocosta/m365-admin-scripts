name: Validate PowerShell utilities

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulated-scenarios:
    runs-on: windows-latest
    name: Utility scenarios
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run Windows PowerShell 5.1 scenarios
        shell: powershell
        run: .\tests\Invoke-Tests.ps1
      - name: Run PowerShell 7 scenarios
        if: ${{ !cancelled() }}
        shell: pwsh
        run: .\tests\Invoke-Tests.ps1
