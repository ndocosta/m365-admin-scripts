name: Validate PowerShell utilities

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulated-scenarios:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    name: Utility scenarios (${{ matrix.shell }})
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run credential-free scenarios
        shell: ${{ matrix.shell }}
        run: .\tests\Invoke-Tests.ps1
